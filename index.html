<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Nhịp Học — Tiến bộ mỗi ngày</title>
<meta name="description" content="Nhịp Học: mục tiêu, lịch học, thẻ nhớ và nhìn lại mỗi ngày — Nội trú & Tiếng Anh."/>
<link rel="stylesheet" href="style.css"/>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="app-shell" id="app">
  <button class="sidebar-shade" id="sidebarShade" hidden aria-label="Đóng menu"></button>
  <aside class="sidebar" id="sidebar" aria-label="Điều hướng">
    <a class="brand" href="#" data-action="nav" data-view="today" aria-label="Nhịp Học">
      <span class="brand-icon" data-icon="sprout"></span>
      <span>nhịp học<span class="brand-dot">.</span><small>TIẾN BỘ MỖI NGÀY</small></span>
    </a>
    <div class="workspace-label">KHÔNG GIAN CỦA BẠN</div>
    <nav id="mainNav">
      <button class="nav-item" data-action="nav" data-view="today"><span data-icon="dashboard"></span><span>Hôm nay</span><span class="nav-active-dot" hidden></span></button>
      <button class="nav-item" data-action="nav" data-view="goals"><span data-icon="target"></span><span>Mục tiêu</span><span class="nav-active-dot" hidden></span></button>
      <button class="nav-item" data-action="nav" data-view="calendar"><span data-icon="calendar"></span><span>Lịch học</span><span class="nav-active-dot" hidden></span></button>
      <button class="nav-item" data-action="nav" data-view="learn"><span data-icon="book"></span><span>Góc học tập</span><small id="navDueCount" hidden></small><span class="nav-active-dot" hidden></span></button>
      <button class="nav-item" data-action="nav" data-view="analytics"><span data-icon="chart"></span><span>Tiến độ</span><span class="nav-active-dot" hidden></span></button>
      <button class="nav-item" data-action="nav" data-view="review"><span data-icon="sprout"></span><span>Nhìn lại</span><span class="nav-active-dot" hidden></span></button>
      <button class="nav-item" data-action="nav" data-view="ai"><span data-icon="sparkles"></span><span>AI Gemini</span><span class="nav-active-dot" hidden></span></button>
    </nav>
    <div class="sidebar-divider"></div>
    <div class="workspace-label">HÀNH TRÌNH</div>
    <button class="journey-link" data-action="journey" data-subject="Nội trú"><span class="tiny-dot purple"></span> Bác sĩ Nội trú <span data-icon="chevR"></span></button>
    <button class="journey-link" data-action="journey" data-subject="Tiếng Anh"><span class="tiny-dot green"></span> Tiếng Anh <span data-icon="chevR"></span></button>
    <div class="sidebar-bottom">
      <button class="nav-item" data-action="nav" data-view="settings"><span data-icon="settings"></span><span>Cài đặt</span><span class="nav-active-dot" hidden></span></button>
      <div class="sidebar-profile">
        <span class="avatar" id="profileAvatar">H</span>
        <span><strong id="profileName">Người học</strong><small>Không gian cá nhân</small></span>
        <span class="online-dot"></span>
      </div>
    </div>
  </aside>
  <div class="main-shell">
    <header class="topbar">
      <div class="breadcrumbs">
        <button class="icon-button mobile-menu" id="menuBtn" aria-label="Mở menu" data-action="menu"><span data-icon="menu"></span></button>
        <span>Không gian học tập</span><span data-icon="chevR"></span><strong id="crumb">Hôm nay</strong>
      </div>
      <div class="top-actions">
        <button class="icon-button" aria-label="Giao diện" title="Giao diện & cỡ chữ" data-action="prefs"><span data-icon="moon"></span></button>
        <div class="search-box">
          <span data-icon="search"></span>
          <input id="searchInput" aria-label="Tìm kiếm trong mục đang xem" placeholder="Tìm trong mục này…"/>
          <button id="searchClear" aria-label="Xóa tìm kiếm" hidden data-action="search-clear"><span data-icon="x"></span></button>
        </div>
        <button class="sync-pill" id="syncPill" data-action="sync-open" title="Đồng bộ Drive">
          <span id="syncIcon" data-icon="cloudOff"></span><span id="syncLabel">Chưa kết nối Drive</span>
        </button>
        <button class="avatar small" id="avatarBtn" data-action="nav" data-view="settings" aria-label="Cài đặt tài khoản">H</button>
      </div>
    </header>
    <main class="main-content" id="view"></main>
    <nav class="mobile-bottom-nav" aria-label="Điều hướng nhanh">
      <button data-action="nav" data-view="today"><span data-icon="dashboard"></span><span>Hôm nay</span></button>
      <button data-action="nav" data-view="goals"><span data-icon="target"></span><span>Mục tiêu</span></button>
      <button data-action="nav" data-view="calendar"><span data-icon="calendar"></span><span>Lịch học</span></button>
      <button data-action="nav" data-view="learn"><span data-icon="book"></span><span>Học tập</span></button>
      <button data-action="nav" data-view="ai"><span data-icon="sparkles"></span><span>AI Gemini</span></button>
    </nav>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script src="app.js" defer></script>
</body>
</html>
