<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>Nhịp Học</title>
<link rel="stylesheet" href="style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="app.js" defer></script>
</head>
<body>
<header>
  <h1>Nhịp Học</h1>
  <span id="sync" role="status" aria-live="polite"></span>
</header>
<nav id="nav" aria-label="Chức năng">
  <button data-act="tab" data-tab="tasks">Mục tiêu</button>
  <button data-act="tab" data-tab="plan">Lịch tuần</button>
  <button data-act="tab" data-tab="cards">Thẻ ghi nhớ</button>
  <button data-act="tab" data-tab="notes">Sổ tay</button>
  <button data-act="tab" data-tab="log">Nhật ký</button>
  <button data-act="tab" data-tab="stats">Thống kê</button>
  <button data-act="tab" data-tab="focus">Tập trung</button>
  <button data-act="tab" data-tab="ai">Gemini</button>
  <button data-act="tab" data-tab="settings">Cài đặt</button>
</nav>
<main id="view"></main>
<input type="file" id="imp" accept="application/json,.json,.csv,text/csv" hidden>
</body>
</html>
